<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam Asmaca</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  text-align:center;
}

h1{margin-top:10px;}

canvas{
  background: rgba(255,255,255,0.1);
  border-radius:10px;
  margin-top:10px;
}

#word{
  font-size:30px;
  letter-spacing:8px;
  margin:20px;
}

#letters{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  max-width:600px;
  margin:auto;
}

button{
  margin:4px;
  padding:10px;
  width:40px;
  border:none;
  border-radius:8px;
  background:#ff6b6b;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

button:disabled{
  background:gray;
}

#wrong{
  margin-top:10px;
  color:#ffb3b3;
}
</style>
</head>

<body>

<h1>🎮 Adam Asmaca</h1>

<canvas id="c" width="200" height="200"></canvas>

<div id="word"></div>
<div id="letters"></div>
<div id="wrong">❌ Yanlış: </div>

<button onclick="startGame()" style="width:auto;padding:10px 20px;">Yeni Oyun 🔄</button>

<script>
const words = ["javascript","bilgisayar","telefon","istanbul","ankara","internet"];

let word="";
let guessed=[];
let wrong=[];
let lives=6;

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function draw(step){
  ctx.strokeStyle="white";
  ctx.lineWidth=2;

  if(step===1){ctx.beginPath();ctx.moveTo(10,190);ctx.lineTo(190,190);ctx.stroke();}
  if(step===2){ctx.beginPath();ctx.moveTo(50,190);ctx.lineTo(50,20);ctx.stroke();}
  if(step===3){ctx.beginPath();ctx.moveTo(50,20);ctx.lineTo(120,20);ctx.stroke();}
  if(step===4){ctx.beginPath();ctx.moveTo(120,20);ctx.lineTo(120,40);ctx.stroke();}
  if(step===5){ctx.beginPath();ctx.arc(120,60,20,0,Math.PI*2);ctx.stroke();}
  if(step===6){ctx.beginPath();ctx.moveTo(120,80);ctx.lineTo(120,130);ctx.stroke();}
}

function updateWord(){
  document.getElementById("word").innerText =
    word.split("").map(l=> guessed.includes(l)?l:"_").join(" ");

  if(word.split("").every(l=>guessed.includes(l))){
    setTimeout(()=>alert("🎉 Kazandın!"),100);
  }
}

function updateLetters(){
  const box=document.getElementById("letters");
  box.innerHTML="";

  "abcdefghijklmnopqrstuvwxyz".split("").forEach(l=>{
    const b=document.createElement("button");
    b.innerText=l;
    b.onclick=()=>guess(l);
    b.disabled=guessed.includes(l)||wrong.includes(l);
    box.appendChild(b);
  });
}

function guess(l){
  if(word.includes(l)){
    guessed.push(l);
  } else {
    wrong.push(l);
    lives--;
    draw(6-lives);
  }

  document.getElementById("wrong").innerText="❌ Yanlış: "+wrong.join(", ");

  if(lives<=0){
    setTimeout(()=>alert("💀 Kaybettin! Kelime: "+word),100);
  }

  updateWord();
  updateLetters();
}

function startGame(){
  ctx.clearRect(0,0,200,200);

  word = words[Math.floor(Math.random()*words.length)];
  guessed=[];
  wrong=[];
  lives=6;

  document.getElementById("wrong").innerText="❌ Yanlış: ";

  updateWord();
  updateLetters();
}

startGame();
</script>

</body>
</html>
