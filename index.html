<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam Asmaca Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  text-align:center;
}

.screen{
  display:none;
  padding:20px;
}

.active{
  display:block;
}

h1{margin-top:20px;}

button{
  padding:10px 20px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

#startBtn{
  background:#00c853;
  color:white;
  font-size:18px;
}

canvas{
  background: rgba(255,255,255,0.08);
  border-radius:12px;
  margin:10px;
}

#word{
  font-size:32px;
  letter-spacing:10px;
  margin:15px;
}

#letters{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  max-width:600px;
  margin:auto;
}

.letter{
  width:40px;
  margin:4px;
  padding:10px;
  background:#ff6b6b;
  border-radius:8px;
}

.letter:disabled{
  background:gray;
}

#wrong{
  color:#ffb3b3;
  margin-top:10px;
}

#shake{
  animation: shake 0.3s;
}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  50%{transform:translateX(5px);}
  75%{transform:translateX(-5px);}
  100%{transform:translateX(0);}
}

.win{
  color:#00ff99;
  animation: win 1s infinite alternate;
}

@keyframes win{
  from{transform:scale(1);}
  to{transform:scale(1.2);}
}
</style>
</head>

<!-- MENÜ -->
<div id="menu" class="screen active">

  <p>Kelimeyi tahmin et, adamı kurtar!</p>
  <button id="startBtn" onclick="startGame()">BAŞLA ▶</button>
</div>

<!-- OYUN -->
<div id="game" class="screen">

  <canvas id="c" width="200" height="200"></canvas>

  <div id="score">🏆 Skor: 0</div>

  <div id="word"></div>
  <div id="letters"></div>
  <div id="wrong">❌ Yanlış: </div>
</div>

<!-- SON -->
<div id="end" class="screen">
  <h1 id="endText"></h1>
  <button onclick="startGame()">🔄 Tekrar Oyna</button>
</div>
